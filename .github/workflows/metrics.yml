name: Metrics
on:
  # Atualiza automaticamente todo dia à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Atualiza a cada push no README
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          # Tema escuro parecido com o print
          theme: dark-purple
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo

          # Card "My GitHub Statistics" (stars, commits, PRs, issues, rank)
          plugin_lines: yes
          plugin_lines_section_stars: yes
          plugin_lines_section_lines: no

          # Card "My Top Used Languages"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_threshold: 0%
          plugin_languages_limit: 20
